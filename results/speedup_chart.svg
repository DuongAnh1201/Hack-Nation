<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
<title id="t">Share of runs that reached the target vs simulator evaluations</title>
<desc id="d">On the same simulator, search space and budget (100 evaluations per run, 5 runs per method), the median number of evaluations needed to reach the target net cooling power of 50 W/m² (the Stanford design in our simulator) was: Scripted oracle (upper bound) 34 (4/5 runs reached it); random search &gt; 100 (2/5 runs reached it); Alternating 27 (4/5 runs reached it); Bayesian optimization 45 (5/5 runs reached it); Genetic algorithm 99 (3/5 runs reached it); Scripted oracle no analyst &gt; 100 (0/5 runs reached it). Scripted oracle (upper bound) needed 2.9× fewer evaluations than random search in the point estimate, but the 95% CI (0.0×–3.6×) includes no speed-up, so no speed-up is claimed. Random search reached the target in fewer than half of its runs, so its median is capped at the budget of 100 and the true speed-up is larger. No speed-up: Scripted oracle (upper bound) needed 1.3× as many evaluations as Alternating (median). Scripted oracle (upper bound) needed 1.3× fewer evaluations than Bayesian optimization in the point estimate, but the 95% CI (0.0×–1.6×) includes no speed-up, so no speed-up is claimed. Scripted oracle (upper bound) needed 2.9× fewer evaluations than Genetic algorithm in the point estimate, but the 95% CI (0.0×–3.5×) includes no speed-up, so no speed-up is claimed. Scripted oracle (upper bound) needed 2.9× fewer evaluations than Scripted oracle no analyst in the point estimate, but the 95% CI (0.0×–3.6×) includes no speed-up, so no speed-up is claimed. Scripted oracle no analyst reached the target in fewer than half of its runs, so its median is capped at the budget of 100 and the true speed-up is larger. Failed runs are included in every number.</desc>
<rect width="760" height="460" fill="#fcfcfb"/>
<text x="64" y="30" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">Share of runs that reached the target cooling power</text>
<text x="64" y="50" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">target 50 W/m² (Stanford design in our simulator) · budget 100 evaluations · 5 runs per method</text>
<text x="64" y="68" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Dots mark each method's median (where its line crosses 50%). Failed runs keep a line below 100%.</text>
