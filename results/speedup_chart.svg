<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
<title id="t">Share of runs that reached the target vs simulator evaluations</title>
<desc id="d">On the same simulator, search space and budget (100 evaluations per run, 10 runs per method), the median number of evaluations needed to reach the target net cooling power of 50 W/m² (the Stanford design in our simulator) was: the agent lab 34 (9/10 runs reached it); random search &gt; 100 (3/10 runs reached it); Alternating 27 (7/10 runs reached it); Bayesian optimization 45 (10/10 runs reached it); Genetic algorithm 60 (8/10 runs reached it); the ablation without analyst feedback &gt; 100 (0/10 runs reached it). The agent lab needed about 2.9× fewer evaluations than random search (95% CI 2.6×–3.8×); we claim at least 2.6×. Random search reached the target in fewer than half of its runs, so its median is capped at the budget of 100 and the true speed-up is larger. No speed-up: the agent lab needed 1.3× as many evaluations as Alternating (median). The agent lab needed 1.3× fewer evaluations than Bayesian optimization in the point estimate, but the 95% CI (0.8×–1.8×) includes no speed-up, so no speed-up is claimed. The agent lab needed 1.8× fewer evaluations than Genetic algorithm in the point estimate, but the 95% CI (1.0×–3.0×) includes no speed-up, so no speed-up is claimed. The agent lab needed about 2.9× fewer evaluations than the ablation without analyst feedback (95% CI 2.9×–3.8×); we claim at least 2.9×. The ablation without analyst feedback reached the target in fewer than half of its runs, so its median is capped at the budget of 100 and the true speed-up is larger. Failed runs are included in every number.</desc>
