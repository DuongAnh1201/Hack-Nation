spec_version: 1
name: review_safety_specialist
description: >-
  Audits this cycle's claims against the record and flags actions that need human approval.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

# File and shell tools (sys_os_*), read-only: the macOS Seatbelt / Linux bwrap sandbox blocks writes.
# Needed because it checks record numbers against the CSV files. No writes anywhere, no network.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    write_paths: []
    allow_network: false
