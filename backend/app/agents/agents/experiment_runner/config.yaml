spec_version: 1
name: experiment_runner
description: >-
  Decides whether an experiment ran as planned and its data is accepted as a result.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

tools:
  agents:
    - experiment_runner_specialist
    - experiment_runner_secretary

# File and shell tools (sys_os_*), read-only: the macOS Seatbelt / Linux bwrap sandbox blocks writes.
# Needed because it checks run.py, results.csv and output.log after a run. No writes anywhere, no network.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    write_paths: []
    allow_network: false
