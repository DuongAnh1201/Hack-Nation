spec_version: 1
name: experiment_runner_specialist
description: >-
  Writes and runs the experiment script, and saves the data as a CSV file.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

# File and shell tools (sys_os_read/write/edit/shell) in a macOS Seatbelt / Linux bwrap sandbox:
# Needed because it writes run.py into its experiment folder. Writes only under runs/, no network. Lab tools run outside this sandbox.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    write_paths: ["runs"]
    allow_network: false
