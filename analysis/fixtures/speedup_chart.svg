<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
<title id="t">Share of runs that reached the target vs simulator evaluations</title>
<desc id="d">On the same simulator, search space and budget (2000 evaluations per run, 10 runs per method), the median number of evaluations needed to reach the target net cooling power of 55 W/m² (the Stanford design in our simulator) was: the agent lab 359 (9/10 runs reached it); random search &gt; 2000 (4/10 runs reached it); Bayesian optimization 878 (7/10 runs reached it); the ablation without analyst feedback 943 (6/10 runs reached it). The agent lab needed about 5.6× fewer evaluations than random search (95% CI 4.0×–7.0×); we claim at least 4.0×. Random search reached the target in fewer than half of its runs, so its median is capped at the budget of 2000 and the true speed-up is larger. The agent lab needed about 2.4× fewer evaluations than Bayesian optimization (95% CI 1.4×–6.0×); we claim at least 1.4×. The agent lab needed about 2.6× fewer evaluations than the ablation without analyst feedback (95% CI 1.8×–7.0×); we claim at least 1.8×. Failed runs are included in every number.</desc>
<rect width="760" height="460" fill="#fcfcfb"/>
<text x="64" y="30" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">Share of runs that reached the target cooling power</text>
<text x="64" y="50" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">target 55 W/m² (Stanford design in our simulator) · budget 2,000 evaluations · 10 runs per method</text>
<text x="64" y="68" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Dots mark each method's median (where its line crosses 50%). Failed runs keep a line below 100%.</text>
